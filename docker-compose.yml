# Hébergement autonome de N-marke (PostgreSQL + volume persistant).
# Usage : docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nmarke
      POSTGRES_PASSWORD: nmarke
      POSTGRES_DB: nmarke
    volumes:
      - nmarke-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmarke"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://nmarke:nmarke@db:5432/nmarke?schema=public"
      JWT_SECRET: "${JWT_SECRET:-change-moi-en-production}"
      NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}"
      OWNER_PASSWORD: "${OWNER_PASSWORD:-nmarke-owner-2026}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-N-marke <no-reply@nmarke.com>}"
      MVOLA_MERCHANT_NUMBER: "${MVOLA_MERCHANT_NUMBER:-+2694909765}"
      POKERA_NUMBER: "${POKERA_NUMBER:-}"
      MVOLA_CONSUMER_KEY: "${MVOLA_CONSUMER_KEY:-}"
      MVOLA_CONSUMER_SECRET: "${MVOLA_CONSUMER_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
    restart: unless-stopped

volumes:
  nmarke-db:
